<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faith and Connected Pastor One App: clickable prototypes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
html,body{margin:0;background:#E9ECF1;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#14171F}
.topbar{position:sticky;top:0;z-index:50;background:#14171F;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
.topbar .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-right:auto}
.topbar button{height:40px;border-radius:20px;border:1px solid #3A404C;background:transparent;color:#D5D9E0;padding:0 16px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.topbar button.on{background:#C8102E;border-color:#C8102E;color:#fff}
.view{display:none}.view.on{display:block}
.phone-stage{display:flex;justify-content:center;padding:28px 12px 48px}
.phone{width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 10px #14171F,0 24px 60px rgba(0,0,0,.25);background:#F5F6F8}
@media (max-width:430px){.phone-stage{padding:0}.phone{border-radius:0;box-shadow:none;width:100vw;height:calc(100vh - 60px)}.phone>div>div{width:100vw!important;height:calc(100vh - 60px)!important}}
.note{max-width:1120px;margin:0 auto;padding:10px 16px;font-size:12px;color:#5B6270}
#app-start{margin:0}
#app-start a{color:#1D4F91}
#app-start a:hover{color:#163C70}
#app-start .card{flex:1 1 300px;min-width:0;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:#14171F}
#app-start .card:hover{border-color:#1D4F91;box-shadow:0 6px 20px rgba(29,79,145,.12)}
#app-member{margin:0}
#app-member a{color:#1D4F91}
#app-member a:hover{color:#163C70}
#app-member button,#app-member input,#app-member textarea,#app-member select{font-family:inherit;color:#14171F}
#app-member button{cursor:pointer}
#app-member button:disabled{opacity:.45;cursor:not-allowed}
#app-member .card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
#app-member .row{display:flex;align-items:center;gap:10px}
#app-member .btn{height:48px;border:none;border-radius:12px;background:#C8102E;color:#FFFFFF;font-size:15px;font-weight:700;padding:0 16px}
#app-member .btn2{height:44px;border:1px solid #D3D8E0;border-radius:10px;background:#FFFFFF;font-size:13px;font-weight:600;padding:0 14px}
#app-member .link{border:none;background:transparent;color:#1D4F91;font-size:13px;font-weight:600;min-height:44px;padding:0 4px}
#app-member .muted{font-size:13px;color:#5B6270}
#app-member .h{font-family:'Space Grotesk',sans-serif;font-weight:700}
#app-member .icon{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
#app-member .chip{border-radius:18px;padding:0 12px;height:36px;font-size:12px;font-weight:600;border:1px solid #D3D8E0}
#app-member .field{height:48px;border:1px solid #B9C0CB;border-radius:12px;padding:0 14px;font-size:15px;background:#FFFFFF;box-sizing:border-box;width:100%}
#app-member .tab{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600}
#app-member .scroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#app-portal{margin:0}
#app-portal a{color:#1D4F91}
#app-portal a:hover{color:#163C70}
#app-portal button,#app-portal input,#app-portal select{font-family:inherit;color:#14171F}
#app-portal button{cursor:pointer}
#app-portal button:disabled{opacity:.45;cursor:not-allowed}
#app-portal td,#app-portal th{padding:10px 12px;text-align:left;border-bottom:1px solid #EEF0F3;font-size:13px;white-space:nowrap}
#app-portal th{font-size:12px;color:#5B6270;font-weight:600}
#app-portal .panel{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
#app-portal .btn{height:44px;border:none;border-radius:10px;background:#1D4F91;color:#FFFFFF;font-size:14px;font-weight:700;padding:0 16px}
#app-portal .btn2{height:40px;border:1px solid #D3D8E0;border-radius:10px;background:#FFFFFF;font-size:13px;font-weight:600;padding:0 12px}
#app-portal .in{height:44px;border:1px solid #B9C0CB;border-radius:10px;padding:0 12px;font-size:14px;background:#FFFFFF;box-sizing:border-box;width:100%}
#app-portal .lbl{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
#app-portal .h2{margin:0;font-size:17px}
#app-portal .muted{font-size:12px;color:#5B6270}
#app-portal .kpi{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}
#app-portal .wrap{overflow-x:auto}
#app-console{margin:0}
#app-console a{color:#1D4F91}
#app-console a:hover{color:#163C70}
#app-console button,#app-console input{font-family:inherit;color:#14171F}
#app-console button{cursor:pointer}
#app-console button:disabled{opacity:.45;cursor:not-allowed}
#app-console td,#app-console th{padding:10px 12px;text-align:left;border-bottom:1px solid #EEF0F3;font-size:13px;white-space:nowrap}
#app-console th{font-size:12px;color:#5B6270;font-weight:600}
#app-console .panel{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
#app-console .btn{height:36px;border:none;border-radius:8px;background:#1D4F91;color:#FFFFFF;font-size:12px;font-weight:700;padding:0 12px}
#app-console .btn2{height:36px;border:1px solid #D3D8E0;border-radius:8px;background:#FFFFFF;font-size:12px;font-weight:600;padding:0 12px}
#app-console .wrap{overflow-x:auto}
#app-console .kpi{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">One App prototypes</span>
  <button data-view="start" class="on">Start</button>
  <button data-view="member">Member app</button>
  <button data-view="portal">Church portal</button>
  <button data-view="console">Econet console</button>
</div>
<div class="view on" id="view-start"><div id="app-start"></div></div>
<div class="view" id="view-member"><div class="phone-stage"><div class="phone"><div id="app-member"></div></div></div><div class="note" style="text-align:center">Prototype with sample data. Use Reset prototype under Me to start again.</div></div>
<div class="view" id="view-portal"><div id="app-portal"></div></div>
<div class="view" id="view-console"><div id="app-console"></div></div>
<template id="tpl-start">
<div style="min-height:800px;background:#F5F6F8;font-family:Inter,system-ui,sans-serif;color:#14171F;padding:56px 24px;box-sizing:border-box">
  <div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:700;letter-spacing:.06em;color:#C8102E">ONE APP · CLICKABLE PROTOTYPES</span>
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:40px;line-height:1.1">Faith and Connected Pastor</h1>
      <p style="margin:0;font-size:17px;line-height:1.5;color:#3D4350;max-width:720px">Three working prototypes of the One App, built from the consolidated requirements spec. Choose one to try it. All names and figures are sample data.</p>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <a class="card" href="MemberApp.dc.html">
        <div style="width:48px;height:48px;border-radius:12px;background:#FDE8EB;color:#C8102E;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></div>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700">Member app</span>
        <span style="font-size:14px;line-height:1.5;color:#3D4350">Choose a church, give a tithe with a receipt, read and compare Bible versions, watch live, buy event tickets and spend and support your church.</span>
        <span style="font-size:14px;font-weight:700;color:#1D4F91">Open member app →</span>
      </a>
      <a class="card" href="PortalApp.dc.html">
        <div style="width:48px;height:48px;border-radius:12px;background:#EAF0F8;color:#1D4F91;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700">Church admin portal</span>
        <span style="font-size:14px;line-height:1.5;color:#3D4350">Switch between pastor, church admin and treasurer. See and spend earnings, approve cash-outs, upload sermons, create events, view members and manage cell groups.</span>
        <span style="font-size:14px;font-weight:700;color:#1D4F91">Open church portal →</span>
      </a>
      <a class="card" href="ConsoleApp.dc.html">
        <div style="width:48px;height:48px;border-radius:12px;background:#E3F3EA;color:#145F38;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700">Econet admin console</span>
        <span style="font-size:14px;line-height:1.5;color:#3D4350">Approve churches, decide on fraud flags, approve the monthly commission run, moderate content and set the rate card.</span>
        <span style="font-size:14px;font-weight:700;color:#1D4F91">Open Econet console →</span>
      </a>
    </div>
    <span style="font-size:13px;color:#5B6270">Each prototype has a link back to this page. The three are not connected: a gift in the member app does not appear in the portal.</span>
  </div>
</div>
</template>
<template id="tpl-member">
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F6F8;font-family:Inter,system-ui,sans-serif;color:#14171F;display:flex;flex-direction:column;overflow:hidden;position:relative">

<template data-sc="if" value="{{ toast }}" hint-placeholder-val="{{ false }}">
  <div role="status" style="position:absolute;top:12px;left:16px;right:16px;z-index:20;background:#14171F;color:#FFFFFF;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)">{{ toast }}</div>
</template>

<!-- HOME -->
<template data-sc="if" value="{{ isHome }}" hint-placeholder-val="{{ true }}">
  <template data-sc="if" value="{{ linked }}" hint-placeholder-val="{{ false }}">
    <div style="background:#1D4F91;color:#FFFFFF;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px">
      <div class="row" style="justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:#D6E2F3">Good morning, Tendai</span><span class="h" style="font-size:20px">{{ churchName }}</span></div>
        <button class="icon" aria-label="Open Me" onClick="{{ goMe }}" style="color:#FFFFFF;border:1px solid #4A73AE;border-radius:22px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg></button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div style="background:#16427C;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#D6E2F3">Your purchases earned</span><span class="h" style="font-size:22px">{{ earnedText }}</span><span style="font-size:11.5px;color:#D6E2F3">for your church this year</span></div>
        <div style="background:#16427C;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#D6E2F3">Faith Points</span><span class="h" style="font-size:22px">{{ pointsText }}</span><span style="font-size:11.5px;color:#D6E2F3">12-day streak</span></div>
      </div>
    </div>
  </template>
  <template data-sc="if" value="{{ notLinked }}" hint-placeholder-val="{{ true }}">
    <div style="background:#FFFFFF;padding:18px 20px;border-bottom:1px solid #E3E6EB;display:flex;flex-direction:column;gap:2px"><span class="muted">Welcome, Tendai</span><span class="h" style="font-size:20px">Today</span></div>
  </template>
  <div class="scroll">
    <template data-sc="if" value="{{ notLinked }}" hint-placeholder-val="{{ true }}">
      <div style="background:#1D4F91;color:#FFFFFF;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px">
        <span style="font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#D6E2F3">CHOOSE YOUR CHURCH</span>
        <span style="font-size:15px;line-height:1.4">Link to your church to give, join a cell group, and let what you buy earn for it.</span>
        <div class="row"><button class="btn2" onClick="{{ goChoose }}" style="border:none;color:#1D4F91;font-weight:700">Find a church</button><button class="btn2" onClick="{{ goChoose }}" style="background:transparent;border-color:#6E92C6;color:#FFFFFF">Scan church QR</button></div>
      </div>
    </template>
    <div class="card">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#C8102E">VERSE OF THE DAY · KJV</span>
      <span style="font-size:15px;line-height:1.45">“I can do all things through Christ which strengtheneth me.”</span>
      <div class="row" style="justify-content:space-between"><span class="muted">Philippians 4:13</span><button class="link" onClick="{{ shareVerse }}">Share</button></div>
    </div>
    <div class="card" style="flex-direction:row;align-items:center;gap:12px">
      <span style="background:#C8102E;color:#FFFFFF;font-size:11px;font-weight:700;border-radius:6px;padding:4px 7px">LIVE</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ liveTitle }}</span><span class="muted">{{ liveSub }}</span></div>
      <button class="btn2" onClick="{{ goLive }}" style="background:#C8102E;color:#FFFFFF;border:none">Watch</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <button onClick="{{ goGive }}" style="height:72px;border:1px solid #E3E6EB;border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4F91" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Give</button>
      <button onClick="{{ goBible }}" style="height:72px;border:1px solid #E3E6EB;border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4F91" stroke-width="1.8" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>Bible</button>
      <button onClick="{{ goEvents }}" style="height:72px;border:1px solid #E3E6EB;border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4F91" stroke-width="1.8" aria-hidden="true"><path d="M4 8h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/></svg>Tickets</button>
      <button onClick="{{ goCell }}" style="height:72px;border:1px solid #E3E6EB;border-radius:12px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4F91" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19a6 6 0 0 1 12 0M14 19a4 4 0 0 1 7 0"/></svg>Cell group</button>
    </div>
    <template data-sc="if" value="{{ linked }}" hint-placeholder-val="{{ false }}">
      <div class="card">
        <div class="row" style="justify-content:space-between"><span style="font-size:15px;font-weight:600">Church roof project</span><span class="muted">{{ roofGivers }} givers</span></div>
        <div style="height:8px;border-radius:4px;background:#E3E6EB;overflow:hidden"><div style="height:8px;background:#1D4F91;width:{{ roofPct }}"></div></div>
        <div class="row" style="justify-content:space-between"><span class="muted">{{ roofText }}</span><button class="link" onClick="{{ giveRoof }}">Give</button></div>
      </div>
    </template>
    <div class="card" style="background:#FFF6E5;border-color:#F3DDB0;flex-direction:row;align-items:center">
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:11.5px;font-weight:700;color:#8A5300">RECOMMENDED FOR YOU</span><span style="font-size:14px;font-weight:600">EcoSure Health for your family</span><span style="font-size:13px;color:#5B4A2A">{{ recoEarn }}</span></div>
      <button class="btn2" onClick="{{ buyEcoSure }}" style="background:#14171F;color:#FFFFFF;border:none">Buy</button>
    </div>
    <a href="Start.dc.html" style="font-size:12px;text-align:center;padding:8px">← All prototypes</a>
  </div>
</template>

<!-- CHOOSE CHURCH -->
<template data-sc="if" value="{{ isChoose }}" hint-placeholder-val="{{ false }}">
  <div class="row" style="background:#FFFFFF;padding:10px 12px;border-bottom:1px solid #E3E6EB"><button class="icon" aria-label="Back" onClick="{{ goHome }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="h" style="font-size:18px">Choose your church</span></div>
  <div class="scroll">
    <label for="q" style="font-size:13px;font-weight:600">Search by name, denomination or area</label>
    <input id="q" class="field" value="{{ q }}" onChange="{{ onQ }}" placeholder="e.g. Glen View">
    <template data-sc="for" list="{{ churchList }}" as="c" hint-placeholder-count="3">
      <button onClick="{{ c.pick }}" style="text-align:left;background:#FFFFFF;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:{{ c.border }}">
        <span style="font-size:15px;font-weight:700">{{ c.name }}</span><span class="muted">{{ c.meta }}</span><span class="muted">{{ c.times }}</span>
      </button>
    </template>
    <template data-sc="if" value="{{ hasPick }}" hint-placeholder-val="{{ false }}">
      <div class="card">
        <span style="font-size:15px;font-weight:700">What {{ pickName }} will see</span>
        <span style="font-size:13px;line-height:1.4">✓ Your number, masked (077 *** 4521), and your name if you add it</span>
        <span style="font-size:13px;line-height:1.4">✓ Which Econet products you hold, as yes or no</span>
        <span style="font-size:13px;line-height:1.4">✕ Never your calls, data use, spending or individual gifts</span>
        <label class="row" style="font-size:13px;font-weight:600;min-height:44px"><input type="checkbox" checked="{{ consent }}" onChange="{{ toggleConsent }}" style="width:22px;height:22px;accent-color:#1D4F91">I agree to share this with my church</label>
        <span style="font-size:12px;color:#5B6270">One church at a time; you can change every 90 days.</span>
      </div>
      <button class="btn" disabled="{{ cannotLink }}" onClick="{{ goOtp }}">Make this my church</button>
    </template>
  </div>
</template>

<!-- OTP -->
<template data-sc="if" value="{{ isOtp }}" hint-placeholder-val="{{ false }}">
  <div class="row" style="background:#FFFFFF;padding:10px 12px;border-bottom:1px solid #E3E6EB"><button class="icon" aria-label="Back" onClick="{{ goChoose }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="h" style="font-size:18px">Confirm with OTP</span></div>
  <div class="scroll">
    <span style="font-size:15px;line-height:1.45">We sent a 4-digit code to 077 *** 4521 to confirm you are joining <strong>{{ pickName }}</strong>.</span>
    <label for="otp" style="font-size:13px;font-weight:600">Code (any 4 digits in this prototype)</label>
    <input id="otp" class="field" value="{{ otp }}" onChange="{{ onOtp }}" style="font-size:24px;letter-spacing:12px;text-align:center">
    <button class="btn" disabled="{{ otpShort }}" onClick="{{ confirmLink }}">Confirm and link</button>
  </div>
</template>

<!-- BIBLE -->
<template data-sc="if" value="{{ isBible }}" hint-placeholder-val="{{ false }}">
  <div class="row" style="background:#FFFFFF;padding:10px 12px;border-bottom:1px solid #E3E6EB;justify-content:space-between">
    <div class="row" style="gap:4px"><button class="icon" aria-label="Back" onClick="{{ goHome }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="h" style="font-size:18px">Psalm 23</span></div>
    <button class="btn2" onClick="{{ toggleNight }}">{{ nightLabel }}</button>
  </div>
  <div style="padding:10px 16px;background:#FFFFFF;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #E3E6EB">
    <span style="font-size:12px;font-weight:600;color:#5B6270">TAP UP TO TWO VERSIONS TO COMPARE</span>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <template data-sc="for" list="{{ versions }}" as="v" hint-placeholder-count="5">
        <button class="chip" disabled="{{ v.locked }}" onClick="{{ v.toggle }}" style="background:{{ v.bg }};color:{{ v.fg }};border-color:{{ v.bd }}">{{ v.label }}</button>
      </template>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat({{ colCount }},minmax(0,1fr));gap:14px;align-content:start;font-family:'Source Serif 4',Georgia,serif;font-size:{{ fontSize }};line-height:1.6;background:{{ pageBg }};color:{{ pageFg }}">
    <template data-sc="for" list="{{ columns }}" as="col" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-family:Inter,sans-serif;font-size:12px;font-weight:700;color:#5C86C4">{{ col.name }}</span>
        <template data-sc="for" list="{{ col.verses }}" as="vs" hint-placeholder-count="3">
          <button onClick="{{ vs.pick }}" style="text-align:left;border:none;padding:2px 4px;border-radius:4px;font:inherit;color:inherit;background:{{ vs.bg }};outline:{{ vs.outline }}"><sup style="font-size:11px;opacity:.7">{{ vs.n }}</sup> {{ vs.t }}</button>
        </template>
      </div>
    </template>
  </div>
  <div class="row" style="padding:10px 16px;background:#FFFFFF;border-top:1px solid #E3E6EB;gap:6px">
    <button class="btn2" style="flex:1" onClick="{{ toggleHighlight }}">{{ hlLabel }}</button>
    <button class="btn2" style="flex:1" onClick="{{ bookmark }}">Bookmark</button>
    <button class="btn2" style="flex:1" onClick="{{ shareVerse }}">Share</button>
    <button class="btn2" style="flex:1;background:#1D4F91;color:#FFFFFF;border:none" onClick="{{ toggleAudio }}">{{ audioLabel }}</button>
  </div>
</template>

<!-- LIVE -->
<template data-sc="if" value="{{ isLive }}" hint-placeholder-val="{{ false }}">
  <div style="height:220px;background:{{ liveBg }};position:relative;display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex-shrink:0">
    <div class="row" style="position:absolute;top:12px;left:12px;gap:8px"><span style="background:#C8102E;font-size:11px;font-weight:700;border-radius:6px;padding:4px 8px">LIVE</span><span style="background:rgba(0,0,0,.45);font-size:12px;border-radius:6px;padding:4px 8px">1,284 watching</span></div>
    <button class="icon" aria-label="Close" onClick="{{ goHome }}" style="position:absolute;top:4px;right:4px;color:#FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span style="font-size:14px;color:#D6E2F3">{{ liveMode }}</span>
    <button onClick="{{ toggleAudioOnly }}" style="position:absolute;bottom:12px;right:12px;height:36px;border-radius:18px;border:1px solid #FFFFFF;background:transparent;color:#FFFFFF;padding:0 12px;font-size:12px;font-weight:600">{{ audioOnlyLabel }}</button>
  </div>
  <div style="background:#FFFFFF;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #E3E6EB">
    <span class="h" style="font-size:18px">{{ liveTitle }}</span><span class="muted">{{ liveSub }}</span>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button class="btn2" onClick="{{ goGive }}" style="background:#C8102E;color:#FFFFFF;border:none">Give</button>
      <button class="btn2" onClick="{{ openPrayer }}">Prayer request</button>
      <button class="btn2" onClick="{{ checkIn }}">{{ checkInLabel }}</button>
    </div>
  </div>
  <div class="scroll">
    <template data-sc="if" value="{{ prayerOpen }}" hint-placeholder-val="{{ false }}">
      <div class="card">
        <label for="pr" style="font-size:13px;font-weight:600">Your prayer request</label>
        <textarea id="pr" value="{{ prayer }}" onChange="{{ onPrayer }}" rows="3" style="border:1px solid #B9C0CB;border-radius:10px;padding:10px;font-size:14px;resize:none"></textarea>
        <button class="btn" disabled="{{ prayerEmpty }}" onClick="{{ sendPrayer }}" style="height:44px">Send to the prayer team</button>
      </div>
    </template>
    <span style="font-size:15px;font-weight:700">Sermon library</span>
    <template data-sc="for" list="{{ sermons }}" as="s" hint-placeholder-count="3">
      <div class="card" style="flex-direction:row;align-items:center;gap:12px;padding:10px 12px">
        <div style="width:56px;height:44px;border-radius:8px;background:#DCE5F2;flex-shrink:0"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ s.title }}</span><span style="font-size:12px;color:#5B6270">{{ s.meta }}</span></div>
        <button class="btn2" onClick="{{ s.act }}" style="padding:0 10px">{{ s.label }}</button>
      </div>
    </template>
  </div>
</template>

<!-- GIVE -->
<template data-sc="if" value="{{ isGive }}" hint-placeholder-val="{{ false }}">
  <div class="row" style="background:#FFFFFF;padding:10px 12px;border-bottom:1px solid #E3E6EB"><button class="icon" aria-label="Back" onClick="{{ goHome }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="h" style="font-size:18px">Give</span></div>
  <div class="scroll" style="gap:10px">
    <div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;padding:10px 14px">
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#5B6270">{{ giveToLabel }}</span><span style="font-size:15px;font-weight:600">{{ giveChurchName }}</span></div>
      <button class="link" onClick="{{ cycleGiveChurch }}">Change</button>
    </div>
    <span style="font-size:13px;font-weight:600">Fund</span>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <template data-sc="for" list="{{ funds }}" as="f" hint-placeholder-count="6">
        <button onClick="{{ f.pick }}" style="height:44px;border-radius:12px;font-size:13px;font-weight:600;border:{{ f.border }};background:{{ f.bg }}">{{ f.label }}</button>
      </template>
    </div>
    <div role="group" aria-label="Currency" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#E3E6EB;border-radius:12px;padding:4px">
      <button onClick="{{ setUSD }}" style="height:40px;border-radius:9px;border:none;font-size:14px;font-weight:700;background:{{ usdBg }}">USD</button>
      <button onClick="{{ setZIG }}" style="height:40px;border-radius:9px;border:none;font-size:14px;font-weight:700;background:{{ zigBg }}">ZiG</button>
    </div>
    <label for="amt" style="font-size:13px;font-weight:600">Amount ({{ currency }})</label>
    <input id="amt" class="field" value="{{ amount }}" onChange="{{ onAmount }}" style="height:56px;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700">
    <div class="row" style="gap:8px">
      <template data-sc="for" list="{{ presets }}" as="p" hint-placeholder-count="4">
        <button class="chip" onClick="{{ p.pick }}" style="background:{{ p.bg }};color:{{ p.fg }}">{{ p.label }}</button>
      </template>
    </div>
    <div class="card" style="padding:4px 14px;gap:0">
      <div class="row" style="justify-content:space-between;min-height:48px;border-bottom:1px solid #EEF0F3"><span style="font-size:14px">Pay with</span><button class="link" onClick="{{ cyclePay }}">{{ payLabel }} ▾</button></div>
      <label class="row" style="justify-content:space-between;min-height:48px;font-size:14px">Repeat monthly<input type="checkbox" checked="{{ recurring }}" onChange="{{ toggleRecurring }}" style="width:22px;height:22px;accent-color:#1D4F91"></label>
    </div>
    <button class="btn" disabled="{{ amountInvalid }}" onClick="{{ openConfirm }}" style="height:52px;flex-shrink:0">{{ giveBtn }}</button>
  </div>
  <template data-sc="if" value="{{ confirmOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(20,23,31,.45);display:flex;align-items:flex-end;z-index:10">
      <div style="background:#FFFFFF;width:100%;border-radius:20px 20px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:12px">
        <span class="h" style="font-size:20px">Confirm your gift</span>
        <span style="font-size:14px;line-height:1.5">{{ confirmText }}</span>
        <button class="btn" onClick="{{ confirmGive }}" style="height:52px">Confirm · second tap</button>
        <button class="btn2" onClick="{{ closeConfirm }}">Cancel</button>
      </div>
    </div>
  </template>
</template>

<!-- RECEIPT -->
<template data-sc="if" value="{{ isReceipt }}" hint-placeholder-val="{{ false }}">
  <div class="scroll" style="padding-top:36px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
      <div style="width:64px;height:64px;border-radius:32px;background:#E3F3EA;display:flex;align-items:center;justify-content:center;color:#1B7F4B"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
      <span class="h" style="font-size:24px">Thank you, Tendai</span>
      <span class="muted">Your gift has reached {{ r.church }}. An SMS receipt is on its way.</span>
    </div>
    <div class="card" style="gap:0">
      <div class="row" style="justify-content:space-between;padding-bottom:10px;border-bottom:1px dashed #D3D8E0"><span style="font-size:12px;font-weight:700;color:#5B6270">SAMPLE RECEIPT</span><span style="font-size:13px;font-weight:700">{{ r.no }}</span></div>
      <div class="row" style="justify-content:space-between;min-height:36px"><span class="muted">Church</span><span style="font-size:13px;font-weight:600">{{ r.church }}</span></div>
      <div class="row" style="justify-content:space-between;min-height:36px"><span class="muted">Fund</span><span style="font-size:13px;font-weight:600">{{ r.fund }}</span></div>
      <div class="row" style="justify-content:space-between;min-height:36px"><span class="muted">Amount</span><span class="h" style="font-size:18px">{{ r.amount }}</span></div>
      <div class="row" style="justify-content:space-between;min-height:36px"><span class="muted">Paid with</span><span style="font-size:13px;font-weight:600">{{ r.pay }}</span></div>
      <div class="row" style="justify-content:space-between;min-height:36px"><span class="muted">Repeats</span><span style="font-size:13px;font-weight:600">{{ r.repeat }}</span></div>
    </div>
    <span style="background:#EAF0F8;border-radius:12px;padding:12px 14px;font-size:13px;color:#2C426A;line-height:1.4">Gifts go to the church's giving account and never count as Econet earnings.</span>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button class="btn2" onClick="{{ downloadPdf }}">Download PDF</button>
      <button class="btn2" onClick="{{ goHistory }}">Giving history</button>
    </div>
    <button class="btn" onClick="{{ goHome }}" style="background:#14171F">Done</button>
  </div>
</template>

<!-- HISTORY -->
<template data-sc="if" value="{{ isHistory }}" hint-placeholder-val="{{ false }}">
  <div class="row" style="background:#FFFFFF;padding:10px 12px;border-bottom:1px solid #E3E6EB"><button class="icon" aria-label="Back" onClick="{{ goMe }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="h" style="font-size:18px">Giving history</span></div>
  <div class="scroll">
    <template data-sc="if" value="{{ noReceipts }}" hint-placeholder-val="{{ false }}"><span class="muted">No gifts yet. Your receipts will appear here.</span></template>
    <template data-sc="for" list="{{ receipts }}" as="h" hint-placeholder-count="2">
      <div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px">
        <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ h.fund }} · {{ h.church }}</span><span style="font-size:12px;color:#5B6270">{{ h.no }} · {{ h.pay }}</span></div>
        <span style="font-size:14px;font-weight:700">{{ h.amount }}</span>
      </div>
    </template>
    <button class="btn2" onClick="{{ downloadStatement }}">Download 2026 giving statement</button>
  </div>
</template>

<!-- EVENTS -->
<template data-sc="if" value="{{ isEvents }}" hint-placeholder-val="{{ false }}">
  <div style="background:#FFFFFF;padding:16px 20px;border-bottom:1px solid #E3E6EB;display:flex;flex-direction:column;gap:2px"><span class="h" style="font-size:20px">Events</span><span class="muted">{{ eventsSub }}</span></div>
  <div class="scroll">
    <template data-sc="for" list="{{ eventList }}" as="e" hint-placeholder-count="3">
      <button onClick="{{ e.open }}" style="text-align:left;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:0;overflow:hidden;display:flex;flex-direction:column">
        <div style="height:72px;background:{{ e.color }};padding:12px 14px;box-sizing:border-box;display:flex;align-items:flex-end;color:#FFFFFF"><span class="h" style="font-size:17px">{{ e.name }}</span></div>
        <div style="padding:10px 14px;display:flex;justify-content:space-between;width:100%;box-sizing:border-box"><span class="muted">{{ e.when }}</span><span style="font-size:13px;font-weight:700">{{ e.from }}</span></div>
      </button>
    </template>
    <template data-sc="if" value="{{ hasTickets }}" hint-placeholder-val="{{ false }}">
      <button class="btn2" onClick="{{ goTicket }}">My tickets ({{ ticketCount }})</button>
    </template>
  </div>
</template>

<!-- EVENT DETAIL -->
<template data-sc="if" value="{{ isEvent }}" hint-placeholder-val="{{ false }}">
  <div style="background:{{ ev.color }};color:#FFFFFF;padding:10px 16px 16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0">
    <button class="icon" aria-label="Back" onClick="{{ goEvents }}" style="color:#FFFFFF;margin-left:-10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span style="font-size:12px;color:#E4ECF7">{{ ev.when }}</span>
    <span class="h" style="font-size:22px;line-height:1.15">{{ ev.name }}</span>
    <span style="font-size:13px;color:#E4ECF7">{{ ev.host }}</span>
  </div>
  <div class="scroll" style="gap:10px">
    <span style="font-size:13px;font-weight:600">Choose tickets</span>
    <template data-sc="for" list="{{ ticketTypes }}" as="t" hint-placeholder-count="3">
      <div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;padding:8px 14px">
        <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ t.name }}</span><span style="font-size:12px;color:#5B6270">{{ t.price }}</span></div>
        <div class="row" style="gap:6px"><button class="btn2" aria-label="Fewer" onClick="{{ t.dec }}" style="width:44px;padding:0;font-size:18px">−</button><span style="width:20px;text-align:center;font-size:15px;font-weight:700">{{ t.qty }}</span><button class="btn2" aria-label="More" onClick="{{ t.inc }}" style="width:44px;padding:0;font-size:18px">+</button></div>

    <div class="row" style="gap:8px;flex-wrap:wrap">
      <template data-sc="for" list="{{ ticketPays }}" as="tp" hint-placeholder-count="4">
        <button class="chip" disabled="{{ tp.disabled }}" onClick="{{ tp.pick }}" style="background:{{ tp.bg }};color:{{ tp.fg }}">{{ tp.label }}</button>
      </template>
    </div>
    <span style="font-size:12px;color:#5B6270">{{ ticketNote }}</span>
  </div>
  <div class="row" style="background:#FFFFFF;border-top:1px solid #E3E6EB;padding:12px 16px 18px;gap:12px">
    <div style="display:flex;flex-direction:column"><span style="font-size:12px;color:#5B6270">{{ ticketQtyText }}</span><span class="h" style="font-size:20px">{{ ticketTotalText }}</span></div>

  </div>
